<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potato Photo Editor PRO</title>
<style>
:root{--bg:#0f0f0f;--card:#1e1e1e;--accent:#4a8cff;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
header{padding:15px;display:flex;justify-content:space-between;align-items:center;background:var(--card)}
header h1{font-size:18px} header h1 span{color:var(--accent)}
#canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
#canvas{max-width:90%;max-height:70vh;border-radius:8px}
.controls{background:var(--card);padding:12px;border-radius:18px 18px 0 0}
.tools{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.tools button{background:#2a2a2a;border:none;color:#fff;padding:10px 14px;border-radius:10px;white-space:nowrap}
.tools button.active{background:var(--accent)}
.filters{display:flex;gap:10px;overflow-x:auto;margin:10px 0}
.filter{flex:0 0 60px;text-align:center;font-size:11px}
.filter div{width:60px;height:60px;border-radius:12px;background:#333;margin-bottom:4px}
.sliders label{font-size:12px;display:block;margin:8px 0 4px}
input[type=range]{width:100%}
.bottom-nav{display:flex;justify-content:space-around;padding:10px 0}
.bottom-nav button{background:none;border:none;color:#888;font-size:12px}
.bottom-nav button.active{color:var(--accent)}
#textInput{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;padding:8px;font-size:20px;border:2px dashed var(--accent);background:rgba(0,0,0,.5);color:#fff}
</style>
</head>
<body>
<header>
<h1>🥔 Potato Photo Editor <span>PRO</span></h1>
<div>
<input type="file" id="upload" accept="image/*" hidden>
<button onclick="document.getElementById('upload').click()" style="background:var(--accent);border:none;color:#fff;padding:8px 14px;border-radius:8px">Upload</button>
<button onclick="downloadImg()" style="background:#fff;border:none;color:#000;padding:8px 14px;border-radius:8px;margin-left:6px">Save HD</button>
</div>
</header>

<div id="canvas-wrap">
<canvas id="canvas"></canvas>
<input type="text" id="textInput" placeholder="Yahan likho">
</div>

<div class="controls">
<div class="tools">
<button onclick="setMode('filters')" class="active" id="btn-filters">Filters</button>
<button onclick="setMode('adjust')" id="btn-adjust">Adjust</button>
<button onclick="rotateImg(90)" >Rotate</button>
<button onclick="flipImg('h')">Flip H</button>
<button onclick="flipImg('v')">Flip V</button>
<button onclick="removeBG()">BG Remove</button>
<button onclick="addTextMode()">Text</button>
<button onclick="clearCanvas()">Clear</button>
</div>

<div id="panel-filters" class="filters">
<div class="filter" onclick="applyFilter('none')"><div style="background:url('') center/cover"></div>Original</div>
<div class="filter" onclick="applyFilter('grayscale(100%)')"><div style="filter:grayscale(1)"></div>B&W</div>
<div class="filter" onclick="applyFilter('sepia(100%)')"><div style="filter:sepia(1)"></div>Vintage</div>
<div class="filter" onclick="applyFilter('saturate(2)')"><div style="filter:saturate(2)"></div>Vivid</div>
<div class="filter" onclick="applyFilter('contrast(1.4) brightness(0.9)')"><div style="filter:contrast(1.4)"></div>Moody</div>
<div class="filter" onclick="applyFilter('hue-rotate(180deg)')"><div style="filter:hue-rotate(180deg)"></div>Cool</div>
</div>

<div id="panel-adjust" style="display:none" class="sliders">
<label>Brightness <span id="vB">100</span></label><input type="range" id="brightness" min="0" max="200" value="100" oninput="updateAdjust()">
<label>Contrast <span id="vC">100</span></label><input type="range" id="contrast" min="0" max="200" value="100" oninput="updateAdjust()">
<label>Saturation <span id="vS">100</span></label><input type="range" id="saturate" min="0" max="200" value="100" oninput="updateAdjust()">
<label>Blur <span id="vBl">0</span></label><input type="range" id="blur" min="0" max="10" value="0" oninput="updateAdjust()">
</div>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let img=new Image();
let currentFilter='none';
let flipH=1, flipV=1, rot=0;
let b=100,c=100,s=100,bl=0;

document.getElementById('upload').onchange=e=>{
 const file=e.target.files[0];
 if(!file) return;
 img.src=URL.createObjectURL(file);
 img.onload=()=>{ canvas.width=img.width; canvas.height=img.height; draw(); }
}
function draw(){
 ctx.save();
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.translate(canvas.width/2, canvas.height/2);
 ctx.rotate(rot*Math.PI/180);
 ctx.scale(flipH, flipV);
 ctx.translate(-canvas.width/2, -canvas.height/2);
 ctx.filter=`${currentFilter} brightness(${b}%) contrast(${c}%) saturate(${s}%) blur(${bl}px)`;
 ctx.drawImage(img,0,0,canvas.width,canvas.height);
 ctx.restore();
}
function applyFilter(f){ currentFilter=f; draw(); }
function updateAdjust(){
 b=document.getElementById('brightness').value;
 c=document.getElementById('contrast').value;
 s=document.getElementById('saturate').value;
 bl=document.getElementById('blur').value;
 document.getElementById('vB').innerText=b;
 document.getElementById('vC').innerText=c;
 document.getElementById('vS').innerText=s;
 document.getElementById('vBl').innerText=bl;
 draw();
}
function setMode(m){
 document.getElementById('panel-filters').style.display=m==='filters'?'flex':'none';
 document.getElementById('panel-adjust').style.display=m==='adjust'?'block':'none';
 document.querySelectorAll('.tools button').forEach(b=>b.classList.remove('active'));
 if(m==='filters') document.getElementById('btn-filters').classList.add('active');
 if(m==='adjust') document.getElementById('btn-adjust').classList.add('active');
}
function rotateImg(d){ rot=(rot+d)%360; draw(); }
function flipImg(dir){ if(dir==='h') flipH*=-1; else flipV*=-1; draw(); }
function removeBG(){
 // Simple BG remove - makes white-ish pixels transparent
 let imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
 let data=imageData.data;
 for(let i=0;i<data.length;i+=4){
   if(data[i]>230 && data[i+1]>230 && data[i+2]>230){ data[i+3]=0; }
 }
 ctx.putImageData(imageData,0,0);
}
function addTextMode(){
 const t=document.getElementById('textInput');
 t.style.display='block'; t.focus();
 t.onkeydown=e=>{
  if(e.key==='Enter'){
   ctx.font='bold 40px system-ui'; ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=4;
   ctx.strokeText(t.value, 50, 80); ctx.fillText(t.value, 50, 80);
   t.style.display='none'; t.value='';
  }
 }
}
function clearCanvas(){ ctx.clearRect(0,0,canvas.width,canvas.height); location.reload(); }
function downloadImg(){
 const link=document.createElement('a');
 link.download='Potato-Edit-HD.png';
 link.href=canvas.toDataURL('image/png',1.0);
 link.click();
}
</script>
</body>
</html>
