function render(list){
  const grid=document.getElementById('grid');
  document.getElementById('count').innerText=list.length;
  grid.innerHTML="";
  if(list.length==0){
    let q=document.getElementById('search').value;
    grid.innerHTML=`<div style='grid-column:1/3;text-align:center;padding:40px 10px'><b>'${q}' नहीं मिला</b><br><small>Try: bharat dap, bharat mop, sudaan, iffco, kribhco, urea, pesticide</small><br><br><button onclick="document.getElementById('search').value='';filter()" style='background:#e94f8c;color:#fff;border:none;padding:10px 20px;border-radius:20px'>सभी देखो</button></div>`;
    return;
  }
  list.forEach(p=>{
    let oi=products.indexOf(p);
    grid.innerHTML+=`<div class="card" onclick="openD(${oi})"><img src="${p.img}"><div class="card-body"><h3>${p.name}</h3><div class="price">${p.price} <span class="mrp">${p.mrp}</span></div><div style="font-size:10px">⭐ ${p.rating}</div></div></div>`;
  });
}
render(products);
function filter(){
  let q=document.getElementById('search').value.toLowerCase().trim();
  if(q==""){render(products);return;}
  let words=q.split(" ");
  let filtered=products.filter(p=>{
    let text=(p.name+" "+p.tags).toLowerCase();
    return words.every(w=>text.includes(w));
  });
  render(filtered);
}
function catFilter(q,el){
  document.querySelectorAll('.cat span').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  if(q=='all'){document.getElementById('search').value='';render(products);return;}
  document.getElementById('search').value=q;filter();
}
function openD(i){cur=products[i];document.getElementById('dImg').src=cur.img;document.getElementById('dName').innerText=cur.name;document.getElementById('dPrice').innerText=cur.price+"  "+cur.mrp;document.getElementById('dRate').innerText="⭐ "+cur.rating+" • "+cur.tags;document.getElementById('dDesc').innerText=cur.name+"\n\nTags: "+cur.tags+"\n\n• 100% Genuine - Amandeep Krishi Seva Kendra Behat\n• Free Home Delivery Behat Area\n• COD Available\n• Call: 7817005859";document.getElementById('detail').classList.add('show')}
